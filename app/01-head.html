<title>The Ordered List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ============================================================
   THE ORDERED LIST - a Product Owner course
   Visual identity: "municipal ledger"
   ============================================================ */

:root{
  /* light palette (complete; dark blocks below redefine only these) */
  --paper:#F2F2EE;
  --surface:#FBFBF8;
  --surface-2:#EDEDE7;
  --sunk:#E6E7E0;
  --ink:#161A22;
  --ink-2:#5A6472;
  --ink-3:#828B98;
  --rule:#D6D8D0;
  --rule-strong:#B9BDB3;
  --accent:#26356B;
  --accent-soft:#E4E7F2;
  --accent-ink:#26356B;
  --spark:#B5842F;
  --spark-ink:#8A5F14;
  --spark-soft:#F4EADA;
  --ok:#2E6B4F;
  --ok-soft:#E0EFE6;
  --bad:#A83A2E;
  --bad-soft:#F6E4E1;
  --mixed:#5A6472;
  --mixed-soft:#E8EAEC;
  --focus:#26356B;
  --shadow:0 1px 2px rgba(22,26,34,.06), 0 8px 24px -12px rgba(22,26,34,.18);
  --shadow-lift:0 2px 4px rgba(22,26,34,.08), 0 16px 40px -16px rgba(22,26,34,.26);

  --measure:66ch;
  --rail-w:272px;
  --step--1:.8125rem;
  --step-0:1.0625rem;
  --step-1:1.1875rem;
  --step-2:1.4375rem;
  --step-3:1.8125rem;
  --step-4:2.375rem;
  --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --slab:"Zilla Slab",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#12151C;
    --surface:#181C25;
    --surface-2:#1E232E;
    --sunk:#0D1016;
    --ink:#E8E9E4;
    --ink-2:#9AA3B0;
    --ink-3:#78818E;
    --rule:#2A303C;
    --rule-strong:#3B4252;
    --accent:#93A5EA;
    --accent-soft:#1C2340;
    --accent-ink:#B3C0F2;
    --spark:#D9AC5E;
    --spark-ink:#D9AC5E;
    --spark-soft:#2A2318;
    --ok:#6FBE8E;
    --ok-soft:#13291F;
    --bad:#E8877A;
    --bad-soft:#2E1A17;
    --mixed:#9AA3B0;
    --mixed-soft:#232833;
    --focus:#93A5EA;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
    --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#12151C;
  --surface:#181C25;
  --surface-2:#1E232E;
  --sunk:#0D1016;
  --ink:#E8E9E4;
  --ink-2:#9AA3B0;
  --ink-3:#78818E;
  --rule:#2A303C;
  --rule-strong:#3B4252;
  --accent:#93A5EA;
  --accent-soft:#1C2340;
  --accent-ink:#B3C0F2;
  --spark:#D9AC5E;
  --spark-ink:#D9AC5E;
  --spark-soft:#2A2318;
  --ok:#6FBE8E;
  --ok-soft:#13291F;
  --bad:#E8877A;
  --bad-soft:#2E1A17;
  --mixed:#9AA3B0;
  --mixed-soft:#232833;
  --focus:#93A5EA;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  --shadow-lift:0 2px 4px rgba(0,0,0,.45), 0 16px 40px -16px rgba(0,0,0,.8);
}

*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:var(--step-0);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--slab);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
::selection{background:var(--spark-soft);color:var(--ink)}

/* ---------- app frame ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}

/* ---------- docket rail ---------- */
.rail{
  grid-column:1;background:var(--surface);border-right:1px solid var(--rule);
  position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;
  display:flex;flex-direction:column;
}
.brand{padding:22px 20px 16px;border-bottom:1px solid var(--rule)}
.brand-mark{font-family:var(--slab);font-size:var(--step-2);font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand-sub{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}

.meter{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.meter-row b{font-size:var(--step-1);color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.meter-bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter-fill{height:100%;background:var(--spark);border-radius:99px;transition:width .4s ease}

.rail-scroll{flex:1;padding:8px 0 32px}
.rail-group{padding:14px 20px 6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px}
.rail-group::after{content:"";flex:1;height:1px;background:var(--rule)}

.navitem{
  width:100%;display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;
  padding:7px 20px 7px 14px;background:none;border:0;cursor:pointer;text-align:left;
  border-left:3px solid transparent;color:var(--ink-2);font-size:var(--step--1);line-height:1.35;
}
.navitem:hover{background:var(--surface-2);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--accent-soft);color:var(--ink);border-left-color:var(--accent);font-weight:500}
.navitem .no{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);letter-spacing:.02em}
.navitem[aria-current="true"] .no{color:var(--accent)}
.navitem .tick{width:15px;height:15px;flex:none}

.railfoot{padding:12px 20px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- main ---------- */
.main{grid-column:2;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);
  padding:10px 28px;display:flex;align-items:center;gap:14px;min-height:52px;
}
.topbar .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .spacer{flex:1}
.menu-btn{display:none}

.view{padding:36px 28px 96px;flex:1}
.wrap{max-width:var(--measure);margin:0 auto}
.wrap-wide{max-width:min(1080px,100%);margin:0 auto}

/* ---------- shared bits ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.btn{
  font-family:var(--sans);font-size:var(--step--1);font-weight:500;padding:9px 16px;border-radius:6px;
  border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink);cursor:pointer;
  transition:background .15s ease,border-color .15s ease,transform .06s ease;
}
.btn:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn-primary,
:root:not([data-theme="light"]) .btn-primary{color:var(--sunk)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn-primary{color:#fff}}
.btn-primary:hover{background:var(--accent);filter:brightness(1.1);border-color:var(--accent)}
.btn-ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink);border-color:transparent}
.btn-sm{padding:5px 11px;font-size:12px}

.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule)}
.chip-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip-bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip-accent{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip-spark{background:var(--spark-soft);color:var(--spark-ink);border-color:transparent}

.hr{height:1px;background:var(--rule);border:0;margin:32px 0}
.stack{display:flex;flex-direction:column}
.muted{color:var(--ink-2)}
.tnum{font-variant-numeric:tabular-nums}
</style>
